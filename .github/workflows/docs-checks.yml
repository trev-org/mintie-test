name: Docs checks

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "docs.json"
      - ".github/workflows/docs-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global mint
      - run: mint validate
      - run: mint broken-links --check-anchors --check-redirects --check-snippets
