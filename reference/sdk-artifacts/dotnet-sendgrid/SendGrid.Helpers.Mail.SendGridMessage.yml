  type: Method
  source:
    href: https://github.com/sendgrid/sendgrid-csharp/blob/4a315350e910ef10c6579ca5291ed7f82ad9d376/src/SendGrid/Helpers/Mail/SendGridMessage.cs
  assemblies:
  - SendGrid
  namespace: SendGrid.Helpers.Mail
  summary: Add an attachment from a stream to the email. No attachment will be added in the case that the stream cannot be read. Streams of length greater than int.MaxValue are truncated.
  example: []
  syntax:
    content: public Task AddAttachmentAsync(string filename, Stream contentStream, string type = null, string disposition = null, string content_id = null, CancellationToken cancellationToken = default)
    parameters:
    - id: filename
      type: System.String
      description: The filename the attachment will display in the email.
    - id: contentStream
      type: System.IO.Stream
      description: The stream to use as content of the attachment.
    - id: type
      type: System.String
      description: The mime type of the content you are attaching. For example, application/pdf or image/jpeg.
    - id: disposition
      type: System.String
      description: The content-disposition of the attachment specifying how you would like the attachment to be displayed. For example, "inline" results in the attached file being displayed automatically within the message while "attachment" results in the attached file requiring some action to be taken before it is displayed (e.g. opening or downloading the file). Defaults to "attachment". Can be either "attachment" or "inline".
    - id: content_id
      type: System.String
      description: 'A unique id that you specify for the attachment. This is used when the disposition is set to "inline" and the attachment is an image, allowing the file to be displayed within the body of your email. Ex:  &lt;img src="cid:ii_139db99fdb5c3704"&gt;&lt;/img&gt; .'
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A cancellation token which can notify if the task should be canceled.
    return:
      type: System.Threading.Tasks.Task
      description: A <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> representing the asynchronous operation.
    content.vb: Public Function AddAttachmentAsync(filename As String, contentStream As Stream, type As String = Nothing, disposition As String = Nothing, content_id As String = Nothing, cancellationToken As CancellationToken = Nothing) As Task
