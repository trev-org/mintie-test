  summary: Initializes a new instance of the <xref href="SendGrid.Helpers.Reliability.ReliabilitySettings" data-throw-if-not-resolved="false"></xref> class.
  example: []
  syntax:
    content: public ReliabilitySettings(int maximumNumberOfRetries, TimeSpan minimumBackoff, TimeSpan maximumBackOff, TimeSpan deltaBackOff)
    parameters:
    - id: maximumNumberOfRetries
      type: System.Int32
      description: The maximum number of retries to execute against when sending an HTTP Request before throwing an exception. Max value of 5. Default value of 0.
    - id: minimumBackoff
      type: System.TimeSpan
      description: The minimum amount of time to wait between between HTTP retries. Default value of 0 seconds.
    - id: maximumBackOff
      type: System.TimeSpan
      description: the maximum amount of time to wait between between HTTP retries. Max value of 30 seconds. Default value of 0 seconds.
    - id: deltaBackOff
      type: System.TimeSpan
      description: the value that will be used to calculate a random delta in the exponential delay between retries. Default value of 0 seconds.
    content.vb: Public Sub New(maximumNumberOfRetries As Integer, minimumBackoff As TimeSpan, maximumBackOff As TimeSpan, deltaBackOff As TimeSpan)
