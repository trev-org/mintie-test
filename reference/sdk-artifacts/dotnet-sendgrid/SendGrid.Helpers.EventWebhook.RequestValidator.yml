  assemblies:
  - SendGrid
  namespace: SendGrid.Helpers.EventWebhook
  summary: Verify signed event webhook requests.
  example: []
  syntax:
    content: public bool VerifySignature(PublicKey publicKey, string payload, string signature, string timestamp)
    parameters:
    - id: publicKey
      type: EllipticCurve.PublicKey
      description: elliptic curve public key
    - id: payload
      type: System.String
      description: event payload in the request body
    - id: signature
      type: System.String
      description: value obtained from the 'X-Twilio-Email-Event-Webhook-Signature' header
    - id: timestamp
      type: System.String
      description: value obtained from the 'X-Twilio-Email-Event-Webhook-Timestamp' header
    return:
      type: System.Boolean
      description: true or false if signature is valid
