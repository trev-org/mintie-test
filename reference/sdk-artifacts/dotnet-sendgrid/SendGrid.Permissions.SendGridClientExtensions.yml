  assemblies:
  - SendGrid
  namespace: SendGrid.Permissions
  summary: >-
    Create a permissions builder instance that masks the emitted scopes to exclude any scopes not

    contained in the list of scopes already granted for the given API Key the <code class="paramref">client</code> was initialized with.
  example: []
  syntax:
    content: public static Task<SendGridPermissionsBuilder> CreateMaskedPermissionsBuilderForClient(this ISendGridClient client)
    parameters:
    - id: client
      type: SendGrid.ISendGridClient
      description: The SendGrid client.
    return:
      type: System.Threading.Tasks.Task{SendGrid.Permissions.SendGridPermissionsBuilder}
      description: A <xref href="SendGrid.Permissions.SendGridPermissionsBuilder" data-throw-if-not-resolved="false"></xref> instance.
